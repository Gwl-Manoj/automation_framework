name: Publish Maven Repository to GitHub

# Publishes the framework jar to a Maven repository hosted in the
# "maven-repo" branch of this repository. Consumers reference it via:
#   https://raw.githubusercontent.com/Gwl-Manoj/automation_framework/maven-repo/
#
# Triggers:
#   - Pushing a tag matching v* (e.g. v1.0.0)
#   - Manual dispatch from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and deploy to local staging repository
        run: mvn -B clean deploy -DskipTests

      - name: Publish staging repository to maven-repo branch
        run: |
          set -e
          STAGING_DIR="target/maven-repo-staging"
          if [ ! -d "$STAGING_DIR" ]; then
            echo "Staging directory $STAGING_DIR not found. Aborting."
            exit 1
          fi
          cd "$STAGING_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Maven artifacts ${GITHUB_REF_NAME:-manual}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Gwl-Manoj/automation_framework.git" HEAD:maven-repo